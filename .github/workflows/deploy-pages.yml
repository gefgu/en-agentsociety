name: Deploy project website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - static/agentsociety_logo.png
      - static/framework.png
      - En-AgentSociety.pdf
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare website artifact
        run: |
          mkdir -p _site/assets
          cp -R site/. _site/
          cp static/agentsociety_logo.png static/framework.png _site/assets/
          cp En-AgentSociety.pdf _site/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
