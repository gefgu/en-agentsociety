name: Deploy project website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - frontend/public/logo.png
      - En-AgentSociety.pdf
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare website artifact
        run: |
          mkdir -p _site/assets
          cp -R site/. _site/
          cp frontend/public/logo.png _site/assets/
          cp En-AgentSociety.pdf _site/
          if grep -RPn --include='*.html' --include='*.css' '[\x{4e00}-\x{9fff}]' _site; then
            echo "GitHub Pages contains non-English Han characters."
            exit 1
          fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
