[metadata]
name = "societyagent_chat_belief_update"
version = "1.0.0"
origin = "agentsociety"
description = "Update belief attributes for a social contact after receiving a message"

[inputs]

[inputs.content]
type = "text"
description = "Content input value used by this prompt."

[inputs.sender_id]
type = "text"
description = "Sender id input value used by this prompt."

[inputs.relationship_type]
type = "text"
description = "Relationship type input value used by this prompt."

[inputs.relationship_strength]
type = "float"
description = "Relationship strength score (0.0=weak, 1.0=strong)."

[prompt]
input = """You have received a message: {content}
Based on this message, update your beliefs about the sender (ID: {sender_id}) in your social network.
Consider their personality, intentions, and any relevant context from your past interactions, and the current beliefs.
Current belief about the sender: {relationship_type} with {relationship_strength}.
Provide a brief update to your beliefs about this sender.

Return new affinity, trust, and familiarity values (0-1 scale) in JSON format:
{{"affinity": float, "trust": float, "familiarity": float}}
"""
output_guidance = "Return JSON only, without any extra text."

[outputs.affinity]
type = "float"
description = "Updated affinity score (0.0 to 1.0)."

[outputs.trust]
type = "float"
description = "Updated trust score (0.0 to 1.0)."

[outputs.familiarity]
type = "float"
description = "Updated familiarity score (0.0 to 1.0)."
