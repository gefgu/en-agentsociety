[metadata]
name = "plan_guidance_selection"
version = "1.0.0"
origin = "citysim"
description = "Select best guidance option for current need using TPB evaluation"

[inputs]

[inputs.weather]
type = "text"
description = "Weather input value used by this prompt."

[inputs.temperature]
type = "float"
description = "Current temperature context value."

[inputs.other_info]
type = "text"
description = "Other info input value used by this prompt."

[inputs.current_need]
type = "text"
description = "Current need input value used by this prompt."

[inputs.current_location]
type = "text"
description = "Current location input value used by this prompt."

[inputs.current_time]
type = "text"
description = "Current simulation time (HH:MM)."

[inputs.consumption_level]
type = "text"
description = "Consumption level input value used by this prompt."

[inputs.occupation]
type = "text"
description = "Occupation input value used by this prompt."

[inputs.age]
type = "integer"
description = "Age input value used by this prompt."

[inputs.emotion_types]
type = "text"
description = "Emotion types input value used by this prompt."

[inputs.thought]
type = "text"
description = "Thought input value used by this prompt."

[inputs.household]
type = "text"
description = "Household input value used by this prompt."

[inputs.life_stage]
type = "text"
description = "Life stage input value used by this prompt."

[inputs.hobbies]
type = "text"
description = "Hobbies input value used by this prompt."

[inputs.goals]
type = "text"
description = "Goals input value used by this prompt."

[inputs.openness]
type = "integer"
description = "Big Five trait: Openness (1=Low, 2=Medium, 3=High)."

[inputs.conscientiousness]
type = "integer"
description = "Big Five trait: Conscientiousness (1=Low, 2=Medium, 3=High)."

[inputs.extraversion]
type = "integer"
description = "Big Five trait: Extraversion (1=Low, 2=Medium, 3=High)."

[inputs.agreeableness]
type = "integer"
description = "Big Five trait: Agreeableness (1=Low, 2=Medium, 3=High)."

[inputs.neuroticism]
type = "integer"
description = "Big Five trait: Neuroticism (1=Low, 2=Medium, 3=High)."

[inputs.chronotype]
type = "text"
description = "Chronotype input value used by this prompt."

[inputs.work_ethic]
type = "float"
description = "Work-priority preference (0.0=Low work priority, 1.0=High work priority)."

[inputs.social_frequency]
type = "float"
description = "Frequency of seeking social interaction (0.0 to 1.0)."

[inputs.leisure_preference]
type = "text"
description = "Leisure preference input value used by this prompt."

[inputs.options]
type = "text"
description = "Options input value used by this prompt."

[prompt]
input = """As an intelligent agent's decision system, please help me determine a suitable option to satisfy my current need.
The Environment will influence the choice of steps.

Current weather: {weather}
Current temperature: {temperature}
Other information:
-------------------------
{other_info}
-------------------------

Current need: Need to satisfy {current_need}
Current location: {current_location}
Current time: {current_time}
My income/consumption level: {consumption_level}
My occupation: {occupation}
My age: {age}
My emotion: {emotion_types}
My thought: {thought}
Household type: {household}
Life stage: {life_stage}
Hobbies: {hobbies}
Goals: {goals}

Big Five Personality Traits (1=Low, 2=Medium, 3=High):
- Openness: {openness}
- Conscientiousness: {conscientiousness}
- Extraversion: {extraversion}
- Agreeableness: {agreeableness}
- Neuroticism: {neuroticism}

Behavioral Preferences:
- Chronotype: {chronotype} (early_bird/standard/night_owl - affects timing preferences)
- Work Ethic: {work_ethic} (0.0=Low work priority, 1.0=High work priority/workaholic)
- Social Frequency: {social_frequency} (0.0=Prefers solitude, 1.0=Seeks frequent social interaction)
- Leisure Preference: {leisure_preference} (outdoor/indoor/social/solitary)

Guidance Options:
-------------------------
{options}
-------------------------

Please evaluate and select the most appropriate option based on these three dimensions:
1. Attitude: Personal preference and evaluation of the option
2. Subjective Norm: Social environment and others' views on this behavior
3. Perceived Control: Difficulty and controllability of executing this option

Please response in json format (Do not return any other text), example:
{{
    "selected_option": "Select the most suitable option from Guidance Options and extent the option if necessary (or do things that can satisfy your needs or actions unless there is no specific options)",
    "evaluation": {{
        "attitude": "Attitude score for the option (0-1)",
        "subjective_norm": "Subjective norm score (0-1)",
        "perceived_control": "Perceived control score (0-1)",
        "reasoning": "Specific reasons for selecting this option"
    }}
}}
"""
output_guidance = "Return JSON only, without any extra text."

[outputs.selected_option]
type = "text"
description = "Selected guidance option."

[outputs.evaluation]
type = "text"
description = "JSON evaluation object for TPB scores and reasoning."
