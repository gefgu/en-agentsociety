[metadata]
name = "needs_reflection"
version = "1.0.0"
origin = "citysim"
description = "Reflect intervention impact and rebuild needs"

[inputs]

[inputs.intervention_message]
type = "text"
description = "Intervention message input value used by this prompt."

[inputs.current_action]
type = "text"
description = "Current action input value used by this prompt."

[inputs.hunger_satisfaction]
type = "float"
description = "Current hunger satisfaction level (0.0 to 1.0)."

[inputs.energy_satisfaction]
type = "float"
description = "Current energy satisfaction level (0.0 to 1.0)."

[inputs.safety_satisfaction]
type = "float"
description = "Current safety satisfaction level (0.0 to 1.0)."

[inputs.social_satisfaction]
type = "float"
description = "Current social satisfaction level (0.0 to 1.0)."

[inputs.household]
type = "text"
description = "Household input value used by this prompt."

[inputs.life_stage]
type = "text"
description = "Life stage input value used by this prompt."

[inputs.hobbies]
type = "text"
description = "Hobbies input value used by this prompt."

[inputs.openness]
type = "integer"
description = "Big Five trait: Openness (1=Low, 2=Medium, 3=High)."

[inputs.conscientiousness]
type = "integer"
description = "Big Five trait: Conscientiousness (1=Low, 2=Medium, 3=High)."

[inputs.extraversion]
type = "integer"
description = "Big Five trait: Extraversion (1=Low, 2=Medium, 3=High)."

[inputs.agreeableness]
type = "integer"
description = "Big Five trait: Agreeableness (1=Low, 2=Medium, 3=High)."

[inputs.neuroticism]
type = "integer"
description = "Big Five trait: Neuroticism (1=Low, 2=Medium, 3=High)."

[inputs.social_frequency]
type = "float"
description = "Frequency of seeking social interaction (0.0 to 1.0)."

[prompt]
input = """You are an intelligent agent reflection system. Based on the intervention message below, please help to rebuild the satisfaction levels of the agent.

The agent has received/sense the following intervention message:
--------------------------------
{intervention_message}
--------------------------------

And the agent's current needs are:
- hunger_satisfaction: {hunger_satisfaction}
- energy_satisfaction: {energy_satisfaction}
- safety_satisfaction: {safety_satisfaction}
- social_satisfaction: {social_satisfaction}

Household type: {household}
Life stage: {life_stage}
Hobbies: {hobbies}

Big Five Personality Traits (1=Low, 2=Medium, 3=High):
- Openness: {openness}
- Conscientiousness: {conscientiousness}
- Extraversion: {extraversion}
- Agreeableness: {agreeableness}
- Neuroticism: {neuroticism}

Behavioral Preferences:
- Social Frequency: {social_frequency} (0.0=Rarely initiates social contact, 1.0=Frequently seeks social interaction)

The agent's current action is:
--------------------------------
{current_action}
--------------------------------

Please response in json format, example:
{{
    "hunger_satisfaction": new_hunger_satisfaction_value,
    "energy_satisfaction": new_energy_satisfaction_value,
    "safety_satisfaction": new_safety_satisfaction_value,
    "social_satisfaction": new_social_satisfaction_value
}}
If you think the agent has to stop the current action and do something to satisfy the needs, please response in json format, example:
{{
    "do_something": true,
    "description": "Go to the hospital"
}}
"""
output_guidance = "Return JSON only, without any extra text."

[outputs.do_something]
type = "categorical"
description = "Whether intervention requires an explicit action."
categories = [
    "yes",
    "no",
]

[outputs.description]
type = "text"
description = "Intervention action description when do_something is yes."

[outputs.hunger_satisfaction]
type = "float"
description = "Updated hunger satisfaction level."

[outputs.energy_satisfaction]
type = "float"
description = "Updated energy satisfaction level."

[outputs.safety_satisfaction]
type = "float"
description = "Updated safety satisfaction level."

[outputs.social_satisfaction]
type = "float"
description = "Updated social satisfaction level."
