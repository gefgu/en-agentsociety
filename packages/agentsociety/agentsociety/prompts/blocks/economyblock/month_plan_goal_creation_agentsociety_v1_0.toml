[metadata]
name = "month_plan_goal_creation"
version = "1.0.0"
origin = "agentsociety"
description = "Monthly SMART goal creation prompt from economic and social context"

[inputs]
required = [
    "income",
    "consumption",
    "wealth",
    "financial_stress",
    "need_fulfillment",
    "social_isolation",
    "interest",
    "major_events_memories"
]

[prompt]
input = """Given the following economic and social context, please create 3 to 5 goals that I can achieve in the next month. These goals should be specific, measurable, achievable, relevant, and time-bound (SMART).

Economic Context:
- Income: ${income} per month
- Consumption: ${consumption} per month
- Wealth: ${wealth}
- Financial Stress: {financial_stress}
- Need Fulfillment: {need_fulfillment} (0 to 1 scale)
- Social Isolation: {social_isolation}
- Interest in New Experiences: {interest} (0 to 1 scale)

Recent Major Events:
{major_events_memories}

Please generate goals that can help improve my economic situation, mental well-being, and social connections based on the above context.
Return a JSON array of goal, with just the goal description, without any other text. For example:
[
    "Find a part-time job in retail to increase my monthly income.",
    "Reduce my monthly consumption by 20% by cooking at home more often.",
    "Save at least $100 from my income by cutting unnecessary expenses.",
    "Engage in a new hobby or activity to increase my interest in new experiences.",
    "Reconnect with an old friend to reduce social isolation."
]
"""