[metadata]
name = "worktime_estimate"
version = "1.1.0"
origin = "citysim"
description = "A prompt for estimating the time needed to complete an action based on the overall plan"

[inputs]

[inputs.plan]
type = "text"
description = "Plan input value used by this prompt."

[inputs.current_intention]
type = "text"
description = "Current intention input value used by this prompt."

[inputs.emotion_types]
type = "text"
description = "Emotion types input value used by this prompt."

[inputs.household]
type = "text"
description = "Household input value used by this prompt."

[inputs.life_stage]
type = "text"
description = "Life stage input value used by this prompt."

[inputs.hobbies]
type = "text"
description = "Hobbies input value used by this prompt."

[inputs.goals]
type = "text"
description = "Goals input value used by this prompt."

[inputs.openness]
type = "integer"
description = "Big Five trait: Openness (1=Low, 2=Medium, 3=High)."

[inputs.conscientiousness]
type = "integer"
description = "Big Five trait: Conscientiousness (1=Low, 2=Medium, 3=High)."

[inputs.extraversion]
type = "integer"
description = "Big Five trait: Extraversion (1=Low, 2=Medium, 3=High)."

[inputs.agreeableness]
type = "integer"
description = "Big Five trait: Agreeableness (1=Low, 2=Medium, 3=High)."

[inputs.neuroticism]
type = "integer"
description = "Big Five trait: Neuroticism (1=Low, 2=Medium, 3=High)."

[inputs.work_ethic]
type = "float"
description = "Work-priority preference (0.0=Low work priority, 1.0=High work priority)."

[prompt]
input = """As an intelligent agent's time estimation system, please estimate the time needed to complete the current action based on the overall plan and current intention.

Overall plan:
{plan}

Current action: {current_intention}

Current emotion: {emotion_types}

Household type: {household}
Life stage: {life_stage}
Hobbies: {hobbies}
Goals: {goals}

Big Five Personality Traits (1=Low, 2=Medium, 3=High):
- Openness: {openness}
- Conscientiousness: {conscientiousness}
- Extraversion: {extraversion}
- Agreeableness: {agreeableness}
- Neuroticism: {neuroticism}

Behavioral Preferences:
- Work Ethic: {work_ethic} (0.0=Low work priority/minimal hours, 1.0=High work priority/tends to work overtime)

Examples:
- "Learn programming": {{"time": 120}}
- "Watch a movie": {{"time": 150}} 
- "Play mobile games": {{"time": 60}}
- "Read a book": {{"time": 90}}
- "Exercise": {{"time": 45}}

Please return the result in JSON format (Do not return any other text), the time unit is [minute], example:
{{
    "time": 10
}}
"""
output_guidance = "Return JSON only, without any extra text."

[outputs.time]
type = "integer"
description = "Estimated minutes required for the work action."
