[metadata]
name = "month_plan_observation"
version = "1.0.0"
origin = "agentsociety"
description = "Monthly economic observation prompt for work and consumption propensity decisions"

[inputs]

[inputs.name]
type = "text"
description = "Name input value used by this prompt."

[inputs.age]
type = "integer"
description = "Age input value used by this prompt."

[inputs.city]
type = "text"
description = "City input value used by this prompt."

[inputs.job]
type = "text"
description = "Job input value used by this prompt."

[inputs.skill]
type = "text"
description = "Skill input value used by this prompt."

[inputs.consumption_summary]
type = "text"
description = "Consumption summary input value used by this prompt."

[inputs.tax_summary]
type = "text"
description = "Tax summary input value used by this prompt."

[inputs.price]
type = "text"
description = "Price input value used by this prompt."

[inputs.openness]
type = "integer"
description = "Big Five trait: Openness (1=Low, 2=Medium, 3=High)."

[inputs.conscientiousness]
type = "integer"
description = "Big Five trait: Conscientiousness (1=Low, 2=Medium, 3=High)."

[inputs.extraversion]
type = "integer"
description = "Big Five trait: Extraversion (1=Low, 2=Medium, 3=High)."

[inputs.agreeableness]
type = "integer"
description = "Big Five trait: Agreeableness (1=Low, 2=Medium, 3=High)."

[inputs.neuroticism]
type = "integer"
description = "Big Five trait: Neuroticism (1=Low, 2=Medium, 3=High)."

[inputs.household]
type = "text"
description = "Household input value used by this prompt."

[inputs.life_stage]
type = "text"
description = "Life stage input value used by this prompt."

[inputs.wealth]
type = "text"
description = "Wealth input value used by this prompt."

[inputs.interest_rate_pct]
type = "float"
description = "Current interest rate percentage context."

[prompt]
input = """You're {name}, a {age}-year-old individual living in {city}. As with all Americans, a portion of your monthly income is taxed by the federal government. This taxation system is tiered, income is taxed cumulatively within defined brackets, combined with a redistributive policy: after collection, the government evenly redistributes the tax revenue back to all citizens, irrespective of their earnings.

In the previous month, you worked as a(an) {job}. If you continue working this month, your expected hourly income will be ${skill}.

{consumption_summary}
{tax_summary}
Meanwhile, in the consumption market, the average price of essential goods is now at ${price}.

Your personality traits are as follows: openness {openness}, conscientiousness {conscientiousness}, extraversion {extraversion}, agreeableness {agreeableness}, and neuroticism {neuroticism}. Your household type is {household} and your life stage is {life_stage}.

Your current savings account balance is ${wealth}. Interest rates, as set by your bank, stand at {interest_rate_pct}%.

Your goal is to maximize your utility by deciding how much to work and how much to consume. Your utility is determined by your consumption, income, saving, social service recieved and leisure time. You will spend the time you do not work on leisure activities.

With all these factors in play, and considering aspects like your living costs, any future aspirations, and the broader economic trends, how is your willingness to work this month? Furthermore, how would you plan your expenditures on essential goods, keeping in mind good price?

Please share your decisions in a JSON format as follows:
{{
    "work": a value between 0 and 1, indicating the propensity to work,
    "consumption": a value between 0 and 1, indicating the proportion of all your savings and income you intend to spend on essential goods
}}
Any other output words are NOT allowed.
"""
output_guidance = "Return JSON only, without any extra text."

[outputs.work]
type = "float"
description = "Work propensity score."

[outputs.consumption]
type = "float"
description = "Consumption propensity score."
