[metadata]
name = "cognition_initialize_hobbies"
version = "1.0.0"
origin = "citysim"
description = "Initialize hobbies from profile and psychographic traits"

[inputs]

[inputs.gender]
type = "text"
description = "Gender input value used by this prompt."

[inputs.age]
type = "integer"
description = "Age input value used by this prompt."

[inputs.occupation]
type = "text"
description = "Occupation input value used by this prompt."

[inputs.income]
type = "text"
description = "Income input value used by this prompt."

[inputs.education]
type = "text"
description = "Education input value used by this prompt."

[inputs.household]
type = "text"
description = "Household input value used by this prompt."

[inputs.life_stage]
type = "text"
description = "Life stage input value used by this prompt."

[inputs.openness]
type = "integer"
description = "Big Five trait: Openness (1=Low, 2=Medium, 3=High)."

[inputs.conscientiousness]
type = "integer"
description = "Big Five trait: Conscientiousness (1=Low, 2=Medium, 3=High)."

[inputs.extraversion]
type = "integer"
description = "Big Five trait: Extraversion (1=Low, 2=Medium, 3=High)."

[inputs.agreeableness]
type = "integer"
description = "Big Five trait: Agreeableness (1=Low, 2=Medium, 3=High)."

[inputs.neuroticism]
type = "integer"
description = "Big Five trait: Neuroticism (1=Low, 2=Medium, 3=High)."

[prompt]
input = """You are an intelligent agent profile generator. Based on the demographic and psychographic information below, please generate a list of suitable hobbies for this agent.

Profile Information:
- Gender: {gender}
- Age: {age}
- Occupation: {occupation}
- Income: {income}
- Education: {education}
- Household type: {household}
- Life stage: {life_stage}

Psychographic Traits (1-3 scale):
- Openness: {openness}
- Conscientiousness: {conscientiousness}
- Extraversion: {extraversion}
- Agreeableness: {agreeableness}
- Neuroticism: {neuroticism}

Please generate a list of 2-5 hobbies.
- Ensure the hobbies fit the agent's income level and age (e.g., "Golf" for higher income, "Video Games" for younger cohorts).
- Ensure the hobbies reflect their Big 5 personality (e.g., High Extraversion -> Team Sports; High Openness -> Painting/Travel; High Conscientiousness -> Gardening/Chess).
- These hobbies will be used to determine the agent's daily locations and routines.

Return the values in JSON format with the following structure:

{{
    "hobbies": [
        "Hobby Name 1",
        "Hobby Name 2",
        "Hobby Name 3"
    ]
}}

Example Response:
{{
    "hobbies": [
        "Photography",
        "Hiking",
        "Reading Sci-Fi"
    ]
}}

DO NOT INCLUDE ANY COMMENTS IN YOUR RESPONSE.
"""
output_guidance = "Return JSON only, without any extra text."

[outputs.hobbies]
type = "text"
description = "JSON list of hobby strings."
