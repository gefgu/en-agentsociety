[metadata]
name = "cognition_initialize_big5"
version = "1.0.0"
origin = "citysim"
description = "Initialize Big Five psychographic traits from profile"

[inputs]

[inputs.gender]
type = "text"
description = "Gender input value used by this prompt."

[inputs.education]
type = "text"
description = "Education input value used by this prompt."

[inputs.consumption]
type = "float"
description = "Consumption input value used by this prompt."

[inputs.occupation]
type = "text"
description = "Occupation input value used by this prompt."

[inputs.age]
type = "integer"
description = "Age input value used by this prompt."

[inputs.income]
type = "text"
description = "Income input value used by this prompt."

[inputs.background_story]
type = "text"
description = "Background story input value used by this prompt."

[prompt]
input = """You are an intelligent agent psychographic initialization system. Based on the profile information below, please help initialize the agent's Big Five personality traits.

Profile Information:
- Gender: {gender}
- Education Level: {education}
- Consumption Level: {consumption}
- Occupation: {occupation}
- Age: {age}
- Monthly Income: {income}
- Background Story: {background_story}

Please initialize the agent's Big Five personality traits based on the profile above. Consider generally accepted associations between the provided demographic/socioeconomic factors and personality (e.g., occupation requirements, age maturity principles).

Return the values in JSON format with the following structure:

Psychographic Traits (Integer values 1-3, where 1=Low, 2=Medium, 3=High):
- openness: Openness to experience (creativity, curiosity, preference for novelty)
- conscientiousness: Conscientiousness (discipline, organization, dependability)
- extraversion: Extraversion (sociability, energy, assertiveness)
- agreeableness: Agreeableness (compassion, cooperativeness, trust)
- neuroticism: Neuroticism (emotional instability, anxiety, moodiness)

Please response in json format, example:
{{
  "psychographic_traits": {{
    "openness": 2,
    "conscientiousness": 3,
    "extraversion": 2,
    "agreeableness": 2,
    "neuroticism": 1
  }}
}}
DO NOT INCLUDE ANY COMMENTS IN YOUR RESPONSE.
DO NOT INCLUDE ANY COMMENTS IN YOUR RESPONSE.
DO NOT INCLUDE ANY COMMENTS IN YOUR RESPONSE.
"""
output_guidance = "Return JSON only, without any extra text."

[outputs.psychographic_traits]
type = "text"
description = "JSON object containing Big Five trait values."
