[metadata]
name = "daily_schedule_generation"
version = "1.0.0"
origin = "agentsociety"
description = "Generate a value-driven daily schedule with mandatory and flexible time blocks"

[inputs]

[inputs.day]
type = "text"
description = "Day input value used by this prompt."

[inputs.current_time]
type = "text"
description = "Current simulation time (HH:MM)."

[inputs.occupation]
type = "text"
description = "Occupation input value used by this prompt."

[inputs.age]
type = "integer"
description = "Age input value used by this prompt."

[inputs.income]
type = "text"
description = "Income input value used by this prompt."

[inputs.household]
type = "text"
description = "Household input value used by this prompt."
[inputs.hunger_satisfaction]
type = "float"
description = "Current hunger satisfaction level (0.0 to 1.0)."

[inputs.energy_satisfaction]
type = "float"
description = "Current energy satisfaction level (0.0 to 1.0)."

[inputs.safety_satisfaction]
type = "float"
description = "Current safety satisfaction level (0.0 to 1.0)."

[inputs.social_satisfaction]
type = "float"
description = "Current social satisfaction level (0.0 to 1.0)."

[prompt]
input = """You are an intelligent agent's daily schedule system. Generate a complete daily schedule using recursive time-block decomposition.

Current day: {day}
Current time: {current_time}

Profile Information:
- Occupation: {occupation}
- Age: {age}
- Income: {income}
- Household type: {household}

Current Needs (0-1, lower = more urgent):
- Hunger: {hunger_satisfaction}
- Energy: {energy_satisfaction}
- Safety: {safety_satisfaction}
- Social: {social_satisfaction}

Instructions:
1. Start with MANDATORY high-priority activities (sleep, work) based on chronotype, work_ethic, and occupation.
2. Recursively fill time blocks with MEDIUM-priority tasks (meals, hygiene).
3. Leave some blocks as [EMPTY] for value-driven planning at execution time (leisure, hobbies, socializing).
4. Each block must have: start_time (HH:MM), duration (minutes), activity, description.
5. If an activity does not fill the entire block, subdivide it.
6. Consider current needs when scheduling. Lower satisfaction means higher priority.

Activity Types:
- "sleep": Sleep/rest at home
- "work": Work-related activities
- "meal": Eating (breakfast/lunch/dinner)
- "hygiene": Personal care activities
- "[EMPTY]": Unfilled block for runtime value-driven planning

Response Format (JSON only):
{{
    "blocks": [
        {{"start_time": "06:00", "duration": 30, "activity": "hygiene", "description": "Morning routine"}},
        {{"start_time": "06:30", "duration": 30, "activity": "meal", "description": "Breakfast"}},
        {{"start_time": "07:00", "duration": 60, "activity": "[EMPTY]", "description": "Free time before work"}},
        {{"start_time": "08:00", "duration": 480, "activity": "work", "description": "At workplace"}},
        {{"start_time": "16:00", "duration": 60, "activity": "[EMPTY]", "description": "Evening leisure"}},
        {{"start_time": "17:00", "duration": 60, "activity": "meal", "description": "Dinner"}},
        {{"start_time": "18:00", "duration": 120, "activity": "[EMPTY]", "description": "Evening activities"}},
        {{"start_time": "20:00", "duration": 30, "activity": "hygiene", "description": "Evening routine"}},
        {{"start_time": "20:30", "duration": 570, "activity": "sleep", "description": "Night sleep"}}
    ]
}}

DO NOT INCLUDE COMMENTS OR EXTRA TEXT. RETURN ONLY VALID JSON.
"""
output_guidance = "Return JSON only, without any extra text."

[outputs.blocks]
type = "text"
description = "JSON array of generated daily schedule blocks."
