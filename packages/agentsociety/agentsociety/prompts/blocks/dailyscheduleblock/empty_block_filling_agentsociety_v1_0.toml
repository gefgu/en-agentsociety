[metadata]
name = "empty_block_filling"
version = "1.0.0"
origin = "agentsociety"
description = "Select the best value-driven activity for an empty schedule block"

[inputs]
required = [
    "current_time",
    "current_location",
    "emotion_types",
    "thought",
    "block_start_time",
    "block_duration",
    "block_description",
    "hunger_satisfaction",
    "energy_satisfaction",
    "safety_satisfaction",
    "social_satisfaction",
    "occupation",
    "age",
    "household",
    "life_stage",
    "hobbies",
    "goals",
    "openness",
    "conscientiousness",
    "extraversion",
    "agreeableness",
    "neuroticism",
    "social_frequency",
    "leisure_preference",
]

[inputs.current_time]
type = "text"
description = "Current simulation time (HH:MM)."

[inputs.current_location]
type = "text"
description = "Current location input value used by this prompt."

[inputs.emotion_types]
type = "text"
description = "Emotion types input value used by this prompt."

[inputs.thought]
type = "text"
description = "Thought input value used by this prompt."

[inputs.block_start_time]
type = "text"
description = "Start time of the schedule block (HH:MM)."

[inputs.block_duration]
type = "integer"
description = "Duration of the schedule block in minutes."

[inputs.block_description]
type = "text"
description = "Block description input value used by this prompt."

[inputs.hunger_satisfaction]
type = "float"
description = "Current hunger satisfaction level (0.0 to 1.0)."

[inputs.energy_satisfaction]
type = "float"
description = "Current energy satisfaction level (0.0 to 1.0)."

[inputs.safety_satisfaction]
type = "float"
description = "Current safety satisfaction level (0.0 to 1.0)."

[inputs.social_satisfaction]
type = "float"
description = "Current social satisfaction level (0.0 to 1.0)."

[inputs.occupation]
type = "text"
description = "Occupation input value used by this prompt."

[inputs.age]
type = "integer"
description = "Age input value used by this prompt."

[inputs.household]
type = "text"
description = "Household input value used by this prompt."

[inputs.life_stage]
type = "text"
description = "Life stage input value used by this prompt."

[inputs.hobbies]
type = "text"
description = "Hobbies input value used by this prompt."

[inputs.goals]
type = "text"
description = "Goals input value used by this prompt."

[inputs.openness]
type = "integer"
description = "Big Five trait: Openness (1=Low, 2=Medium, 3=High)."

[inputs.conscientiousness]
type = "integer"
description = "Big Five trait: Conscientiousness (1=Low, 2=Medium, 3=High)."

[inputs.extraversion]
type = "integer"
description = "Big Five trait: Extraversion (1=Low, 2=Medium, 3=High)."

[inputs.agreeableness]
type = "integer"
description = "Big Five trait: Agreeableness (1=Low, 2=Medium, 3=High)."

[inputs.neuroticism]
type = "integer"
description = "Big Five trait: Neuroticism (1=Low, 2=Medium, 3=High)."

[inputs.social_frequency]
type = "float"
description = "Frequency of seeking social interaction (0.0 to 1.0)."

[inputs.leisure_preference]
type = "text"
description = "Leisure preference input value used by this prompt."

[prompt]
input = """You are an intelligent agent's value-driven activity planner. Fill this [EMPTY] time block with the best activity to satisfy your intrinsic desires.

Current Context:
- Current time: {current_time}
- Current location: {current_location}
- Current emotion: {emotion_types}
- Current thought: {thought}

Available Empty Block:
- Start time: {block_start_time}
- Duration: {block_duration} minutes
- Original description: {block_description}

Current Needs (0-1, lower = more urgent):
- Hunger: {hunger_satisfaction}
- Energy: {energy_satisfaction}
- Safety: {safety_satisfaction}
- Social: {social_satisfaction}

Profile:
- Occupation: {occupation}
- Age: {age}
- Household: {household}
- Life stage: {life_stage}
- Hobbies: {hobbies}
- Goals: {goals}

Big Five Personality Traits (1=Low, 2=Medium, 3=High):
- Openness: {openness}
- Conscientiousness: {conscientiousness}
- Extraversion: {extraversion}
- Agreeableness: {agreeableness}
- Neuroticism: {neuroticism}

Behavioral Preferences:
- Social Frequency: {social_frequency}
- Leisure Preference: {leisure_preference}

Task:
Generate and evaluate multiple candidate activities (2-4 options). Select the one that best satisfies your intrinsic desires according to Maslow's Hierarchy.

Consider:
1. Most urgent needs (lowest satisfaction scores).
2. Your personality traits and preferences.
3. Current location and time constraints.
4. Your hobbies and goals.

Response Format (JSON only):
{{
    "candidates": [
        {{"activity": "Contact friends", "expected_need": "social", "expected_satisfaction_gain": 0.3, "reasoning": "Low social satisfaction"}},
        {{"activity": "Practice photography (hobby)", "expected_need": "safety", "expected_satisfaction_gain": 0.2, "reasoning": "Aligns with hobbies and goals"}},
        {{"activity": "Exercise at park", "expected_need": "energy", "expected_satisfaction_gain": 0.15, "reasoning": "Outdoor leisure preference"}}
    ],
    "selected": {{
        "activity": "Contact friends",
        "type": "social",
        "reasoning": "Social need is most urgent and this activity is expected to provide the highest satisfaction gain"
    }}
}}

DO NOT INCLUDE COMMENTS. RETURN ONLY VALID JSON.
"""
output_guidance = "Return JSON only, without any extra text."

[outputs.selected]
type = "text"
description = "Selected activity object for filling an empty schedule block."
