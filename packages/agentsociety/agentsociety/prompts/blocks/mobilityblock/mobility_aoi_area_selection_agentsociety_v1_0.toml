[metadata]
name = "mobility_aoi_area_selection"
version = "1.0.0"
origin = "agentsociety"
description = "Select candidate AOI areas for place search"

[inputs]

[inputs.plan]
type = "text"
description = "Plan input value used by this prompt."

[inputs.intention]
type = "text"
description = "Intention input value used by this prompt."

[inputs.emotion]
type = "text"
description = "Emotion input value used by this prompt."

[inputs.thought]
type = "text"
description = "Thought input value used by this prompt."

[inputs.household]
type = "text"
description = "Household input value used by this prompt."

[inputs.life_stage]
type = "text"
description = "Life stage input value used by this prompt."

[inputs.openness]
type = "integer"
description = "Big Five trait: Openness (1=Low, 2=Medium, 3=High)."

[inputs.conscientiousness]
type = "integer"
description = "Big Five trait: Conscientiousness (1=Low, 2=Medium, 3=High)."

[inputs.extraversion]
type = "integer"
description = "Big Five trait: Extraversion (1=Low, 2=Medium, 3=High)."

[inputs.agreeableness]
type = "integer"
description = "Big Five trait: Agreeableness (1=Low, 2=Medium, 3=High)."

[inputs.neuroticism]
type = "integer"
description = "Big Five trait: Neuroticism (1=Low, 2=Medium, 3=High)."

[inputs.visit_history]
type = "text"
description = "Visit history input value used by this prompt."

[inputs.ranked_areas]
type = "text"
description = "Ranked areas input value used by this prompt."

[prompt]
input = """As an intelligent decision system, please select 3-5 areas (AOIs) where the agent should look for places to visit.

Agent State:
- Current Plan: {plan}
- Current Intention: {intention}
- Current Emotion: {emotion}
- Current Thought: {thought}
- Household: {household}
- Life Stage: {life_stage}
Your Big Five personality traits are: (1=Low, 2=Medium, 3=High)
openness: {openness}, conscientiousness: {conscientiousness}, extraversion: {extraversion}, agreeableness: {agreeableness}, neuroticism: {neuroticism}.

Recent Visit History (last 7 days):
{visit_history}

Candidate Areas (ranked by distance and popularity):
{ranked_areas}

Please select 3-5 area IDs that best match the agent's intention, emotional state, and preferences.
Consider:
1. Distance (closer is generally better)
2. Popularity (more POIs = more options)
3. Past visit patterns
4. Current emotional state and intention

Please response in json format (Do not return any other text), example:
{{
    "selected_area_ids": [123, 456, 789],
    "reasoning": "Selected areas close to home with high popularity for shopping"
}}
"""
output_guidance = "Return JSON only, without any extra text."

[outputs.selected_area_ids]
type = "text"
description = "Selected AOI area id list in JSON array form."

[outputs.reasoning]
type = "text"
description = "Reasoning for AOI area selection."
