[metadata]
name = "social_message_generation"
version = "1.0.0"
origin = "agentsociety"
description = "Generate a context-aware social message to a selected target"

[inputs]
required = [
    "name",
    "gender",
    "occupation",
    "education",
    "personality",
    "emotion_types",
    "thought",
    "background_story",
    "household",
    "life_stage",
    "hobbies",
    "openness",
    "conscientiousness",
    "extraversion",
    "agreeableness",
    "neuroticism",
    "relationship_type",
    "relationship_strength",
    "chat_history",
    "intention",
    "environment_info",
    "discussion_constraint",
]

[inputs.name]
type = "text"
description = "Name input value used by this prompt."

[inputs.gender]
type = "text"
description = "Gender input value used by this prompt."

[inputs.occupation]
type = "text"
description = "Occupation input value used by this prompt."

[inputs.education]
type = "text"
description = "Education input value used by this prompt."

[inputs.personality]
type = "text"
description = "Personality input value used by this prompt."

[inputs.emotion_types]
type = "text"
description = "Emotion types input value used by this prompt."

[inputs.thought]
type = "text"
description = "Thought input value used by this prompt."

[inputs.background_story]
type = "text"
description = "Background story input value used by this prompt."

[inputs.household]
type = "text"
description = "Household input value used by this prompt."

[inputs.life_stage]
type = "text"
description = "Life stage input value used by this prompt."

[inputs.hobbies]
type = "text"
description = "Hobbies input value used by this prompt."

[inputs.openness]
type = "integer"
description = "Big Five trait: Openness (1=Low, 2=Medium, 3=High)."

[inputs.conscientiousness]
type = "integer"
description = "Big Five trait: Conscientiousness (1=Low, 2=Medium, 3=High)."

[inputs.extraversion]
type = "integer"
description = "Big Five trait: Extraversion (1=Low, 2=Medium, 3=High)."

[inputs.agreeableness]
type = "integer"
description = "Big Five trait: Agreeableness (1=Low, 2=Medium, 3=High)."

[inputs.neuroticism]
type = "integer"
description = "Big Five trait: Neuroticism (1=Low, 2=Medium, 3=High)."

[inputs.relationship_type]
type = "text"
description = "Relationship type input value used by this prompt."

[inputs.relationship_strength]
type = "float"
description = "Relationship strength score (0.0=weak, 1.0=strong)."

[inputs.chat_history]
type = "text"
description = "Chat history input value used by this prompt."

[inputs.intention]
type = "text"
description = "Intention input value used by this prompt."

[inputs.environment_info]
type = "text"
description = "Environment info input value used by this prompt."

[inputs.discussion_constraint]
type = "text"
description = "Discussion constraint input value used by this prompt."

[prompt]
input = """My name is {name}, I am a {gender}
My occupation is {occupation}.
My education level is {education}.
My personality is {personality}.
My current emotion is: {emotion_types}.
My current thought is: {thought}.
My background story is: {background_story}.
Household type: {household}
Life stage: {life_stage}
Hobbies: {hobbies}

Big Five Personality Traits (1=Low, 2=Medium, 3=High):
- Openness: {openness}
- Conscientiousness: {conscientiousness}
- Extraversion: {extraversion}
- Agreeableness: {agreeableness}
- Neuroticism: {neuroticism}

Now, I want to generate a social message to a target, my relationship with him/her:
Our relationship type is: {relationship_type}
Our relationship strength: {relationship_strength} (0-1, higher is stronger)
My previous chat history with him/her is:
{chat_history}

My intention is: {intention}.

Environment Information:
{environment_info}

Please generate a natural and contextually appropriate message.
Keep it under 100 characters.
The message should reflect my personality and background.

{discussion_constraint}

Please output the message from a first-person perspective, without any other text
"""
output_guidance = "Return JSON only, without any extra text."

[outputs.message]
type = "text"
description = "Generated social message content."
