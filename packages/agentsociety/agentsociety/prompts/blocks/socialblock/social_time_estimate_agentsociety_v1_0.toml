[metadata]
name = "social_time_estimate"
version = "1.0.0"
origin = "agentsociety"
description = "Estimate time for generic social actions when no specific social sub-action is selected"

[inputs]
required = [
    "plan",
    "intention",
    "emotion_types",
    "household",
    "life_stage",
    "hobbies",
    "goals",
    "openness",
    "conscientiousness",
    "extraversion",
    "agreeableness",
    "neuroticism",
    "chronotype",
    "work_ethic",
    "leisure_preference"
]

[prompt]
input = """As an intelligent agent's time estimation system, please estimate the time needed to complete the current action based on the overall plan and current intention.

Overall plan:
{plan}

Current action: {intention}

Current emotion: {emotion_types}

Household type: {household}
Life stage: {life_stage}
Hobbies: {hobbies}
Goals: {goals}

Big Five Personality Traits (1=Low, 2=Medium, 3=High):
- Openness: {openness}
- Conscientiousness: {conscientiousness}
- Extraversion: {extraversion}
- Agreeableness: {agreeableness}
- Neuroticism: {neuroticism}

Behavioral Preferences:
- Chronotype: {chronotype} (early_bird: wakes ~6am, standard: wakes ~7-8am, night_owl: wakes ~10am)
- Work Ethic: {work_ethic} (0.0=Low priority on work, 1.0=High priority, tends to work overtime)
- Leisure Preference: {leisure_preference} (outdoor/indoor/social/solitary)

Examples:
- "Chat with a friend": {{"time": 20}}
- "Join a group activity": {{"time": 90}}
- "Call family": {{"time": 30}}
- "Browse social media": {{"time": 25}}

Please return the result in JSON format (Do not return any other text), the time unit is [minute], example:
{{
    "time": 10
}}
"""