[metadata]
name = "other_sleep_time_estimate"
version = "1.0.0"
origin = "agentsociety"
description = "Estimate sleep action duration from plan, intention, and persona"

[inputs]
required = [
    "plan",
    "intention",
    "emotion_types",
    "household",
    "life_stage",
    "hobbies",
    "goals",
    "openness",
    "conscientiousness",
    "extraversion",
    "agreeableness",
    "neuroticism",
    "chronotype",
    "leisure_preference"
]

[prompt]
input = """As an intelligent agent's time estimation system, please estimate the time needed to complete the current action based on the overall plan and current intention.

Overall plan:
{plan}

Current action: {intention}

Current emotion: {emotion_types}

Household type: {household}
Life stage: {life_stage}
Hobbies: {hobbies}
Goals: {goals}

Big Five Personality Traits (1=Low, 2=Medium, 3=High):
- Openness: {openness}
- Conscientiousness: {conscientiousness}
- Extraversion: {extraversion}
- Agreeableness: {agreeableness}
- Neuroticism: {neuroticism}

Behavioral Preferences:
- Chronotype: {chronotype} (early_bird: wakes ~6am and goes to bed early, standard: wakes ~7-8am, night_owl: wakes ~10am and stays up late)
- Leisure Preference: {leisure_preference} (outdoor/indoor/social/solitary - affects activity duration)

Examples:
- "Learn programming": {{"time": 120}}
- "Watch a movie": {{"time": 150}}
- "Play mobile games": {{"time": 60}}
- "Read a book": {{"time": 90}}
- "Exercise": {{"time": 45}}

Please return the result in JSON format (Do not return any other text), the time unit is [minute], example:
{{
    "time": 10
}}
"""