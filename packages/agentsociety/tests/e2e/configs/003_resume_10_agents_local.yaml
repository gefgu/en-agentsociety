llm:
  - provider: vllm
    base_url: "http://localhost:8080/v1/"
    api_key: ""
    model: "Qwen/Qwen2.5-32B-Instruct-AWQ"
    concurrency: 256
    timeout: 60
  - provider: vllm
    base_url: "http://200.134.10.4:8080/v1/"
    api_key: ""
    model: "Qwen/Qwen2.5-32B-Instruct-AWQ"
    concurrency: 48
    timeout: 60

env:
  db:
    enabled: true
    db_type: sqlite
  clickhouse:
    host: "localhost"
    port: 8123
    username: "test"
    password: "test"
    database: "testing"
    auto_create_database: true
  home_dir: "./data/home_data/"
  data_dir: "./data/data"
  monitoring_enabled: false
  database_enabled: true

map:
  file_path: "./data/home_data/studied_massy_osm_pois.pb"
  neighborhood_file_path: null

agents:
  citizens:
    - agent_class: citizen
      number: 10

exp:
  name: "e2e_test_clickhouse"
  workflow:
    - type: step
      steps: 100
      ticks_per_step: 600
  environment:
    start_tick: 25200
    workday: true

logging_level: INFO
