[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "en-agentsociety"
version = "1.5.6" # change it for each release
description = "LLM-based city environment agent building library"
authors = [
    { name = "Yuwei Yan", email = "pinkgranite86@gmail.com" },
    { name = "Junbo Yan", email = "yanjb20thu@gmail.com" },
    { name = "Jun Zhang", email = "zhangjun990222@gmail.com" },
    { name = "Zhiheng Zheng", email = "zhengzh20@gmail.com" },
]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
]
dependencies = [
    "aiodocker>=0.24.0",
    "aiosqlite>=0.21.0",
    "asyncpg>=0.30.0",
    "boto3>=1.37",
    "casdoor>=1.29.0",
    "click>=8.0.0",
    "fastembed>=0.3.6",
    "fastapi>=0.103.1",
    "geojson>=3.1.0",
    "grpcio>=1.71.0,<2.0.0",
    "kubernetes-asyncio>=32.3.0",
    # Relaxed from "numpy>=1.20.0,<2.0.0" to allow the numpy 2.x that fastmob/fastmob-vis
    # (mobility extra, local packages) resolve to; the old cap predates that dependency and
    # its original rationale isn't recorded anywhere in this repo's history. If simulations
    # start misbehaving (Ray actor serialization, pandas/pyarrow interop, etc.) after this
    # change, re-pinning to <2.0.0 here is the first thing to try.
    "numpy>=1.23",
    "openai>=1.58.1",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "protobuf>=5.26.0,<6.0.0",
    "pycityproto>=2.4.2",
    "pydantic>=2.10.4",
    "pyproj>=3.6.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.20",
    "PyYAML>=6.0.2",
    "ray[default]>=2.40.0",
    "requests>=2.32.3",
    "Shapely>=2.0.6",
    "sqlalchemy[asyncio]>=2.0.20",
    "uvicorn>=0.23.2",
    "qdrant-client[fastembed]>=1.12.1",
    "json-repair>=0.46.2",
]

[project.optional-dependencies]
duckdb = [
    "duckdb>=1.1.0",
]
# ClickHouse telemetry backend (webapi/clickhouse.py, webapi/analytics_db.py,
# database/clickhouse.py). Optional in prod: without it, ClickHouse reads/writes
# are skipped and the app falls back to DuckDB/SQLite. Pair with the
# performance/docker-compose.yml stack (Prometheus/Grafana/ClickHouse/Loki) to
# actually have a ClickHouse instance to talk to.
clickhouse = [
    "clickhouse-connect",
]
# Mobility-metrics comparison report served by webapi/mobility. The chart/metric
# engines fastmob and fastmob-vis are local (maturin) packages and must be installed
# from source, e.g. `uv pip install /path/to/fastmob /path/to/fastmob-vis`.
mobility = [
    "pandas",
    "joblib",
    "h3",
    "scipy",
]

[project.urls]
Homepage = "https://gefgu.github.io/en-agentsociety/"
Repository = "https://github.com/gefgu/en-agentsociety"
Issues = "https://github.com/gefgu/en-agentsociety/issues"

[project.scripts]
en-agentsociety = "en_agentsociety.cli.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["en_agentsociety"]

[tool.uv.extra-build-dependencies]
grpcio-tools = ["setuptools", "pkg_resources"]
