[project]
name = "agentsociety-e2e"
version = "0.1.0"
description = "Dedicated uv environment for AgentSociety e2e tests"
# Narrow this down to exactly what you want to use, 
# or ensure your environment isn't forcing 3.13
requires-python = ">=3.11,<3.13"
dependencies = [
  "en-agentsociety",
  "clickhouse-connect",
  "opentelemetry-exporter-otlp-proto-grpc",
  "setuptools",
  "testcontainers[clickhouse]",
  "duckdb>=1.1.0",
  # Mobility-metrics comparison report (webapi/mobility) dependencies.
  "pandas",
  "joblib",
  "h3",
  "scipy",
  "skmob2",
  "skmob-vis",
]

[tool.uv.sources]
en-agentsociety = { path = "../..", editable = true }
skmob2 = { path = "/mnt/raid5/gustavo/skmob2", editable = true }
skmob-vis = { path = "/mnt/raid5/gustavo/skmob-vis", editable = true }

[tool.uv]
managed = true

[tool.uv.extra-build-dependencies]
grpcio-tools = ["setuptools"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
