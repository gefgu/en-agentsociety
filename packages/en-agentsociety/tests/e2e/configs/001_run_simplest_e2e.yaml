llm:
  - provider: vllm
    base_url: "http://localhost:8080/v1/"
    api_key: ""
    model: "Qwen/Qwen2.5-32B-Instruct-AWQ"
    concurrency: 10
    timeout: 60

env:
  db:
    enabled: true
    db_type: sqlite
  clickhouse:
    database: "testing"
  home_dir: "./data/home_data/"
  data_dir: "./data/data"
  monitoring_enabled: false

map:
  file_path: "./data/home_data/studied_massy_osm_pois.pb"
  neighborhood_file_path: null

agents:
  citizens:
    - agent_class: citizen
      number: 1

exp:
  name: "001_run_simplest_e2e"
  workflow:
    - type: step
      steps: 10
      ticks_per_step: 600
  environment:
    start_tick: 25200  # 7 * 60 * 60 = 7 AM
    workday: true

logging_level: INFO
